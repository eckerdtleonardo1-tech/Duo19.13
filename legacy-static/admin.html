<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Duo19-13</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2 class="logo">Duo19<span>-</span>13 <br><small style="font-size:1rem; color:var(--text-muted)">ADMIN</small></h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Usuario (Ej: admin)" required>
                <input type="password" id="password" placeholder="Contraseña (Ej: admin123)" required>
                <button type="submit" class="btn-primary">Ingresar al Panel</button>
                <p id="loginError" class="error-msg" style="display:none;">Credenciales incorrectas.</p>
            </form>
        </div>
    </div>

    <div id="adminPanel" class="admin-panel" style="display:none;">
        <header class="header">
            <div class="container header-content">
                <h1 class="logo">Dashboard<span>.</span></h1>
                <div class="controls" style="justify-content: flex-end;">
                    <a href="index.html" class="btn-secondary" style="text-decoration:none; display:inline-block; text-align:center;">Ver Catálogo</a>
                    <button id="logoutBtn" class="btn-primary">Cerrar Sesión</button>
                </div>
            </div>
        </header>

        <main class="container admin-main">
            <section class="form-section">
                <h2 id="formTitle">Agregar Producto</h2>
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="form-group">
                        <label>Nombre del Producto</label>
                        <input type="text" id="prodName" required>
                    </div>
                    <div class="form-group">
                        <label>Precio ($ ARS)</label>
                        <input type="number" id="prodPrice" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="prodCategory" required>
                            <option value="perifericos">Periféricos</option>
                            <option value="iluminacion">Iluminación RGB</option>
                            <option value="organizacion">Organización</option>
                            <option value="decoracion">Decoración</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stock Disponible</label>
                        <input type="number" id="prodStock" min="0" required>
                    </div>
                    
                    <!-- Mejora: Subida de imagen o URL -->
                    <div class="form-group">
                        <label>Imagen (Sube un archivo o pega una URL)</label>
                        <input type="file" id="prodImageFile" accept="image/*" style="margin-bottom: 0.5rem;">
                        <input type="url" id="prodImage" placeholder="O pega una URL de internet aquí...">
                        <small style="color: var(--text-muted);">Si subes un archivo, ignorará la URL.</small>
                    </div>

                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="prodDesc" rows="4" required></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="saveBtn">Guardar Producto</button>
                        <button type="button" class="btn-secondary" id="cancelBtn" style="display:none;">Cancelar</button>
                    </div>
                </form>
            </section>

            <section class="list-section">
                <h2>Lista de Productos</h2>
                <div class="table-responsive">
                    <table id="productsTable">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Categoría</th>
                                <th>Stock</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                            <!-- Inyectado por JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Contenedor para Notificaciones (Toasts) -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
