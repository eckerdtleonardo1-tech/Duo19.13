<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duo19-13 | Setup Gamer & Accesorios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-top">
            <!-- El nombre siempre visible -->
            <a href="index.html" class="logo">Duo19<span>-</span>13</a>
            
            <div class="header-actions">
                <button id="userBtn" class="icon-btn" title="Mi Cuenta">👤</button>
                <div class="cart-icon-wrapper" id="cartBtnHeader">
                    <button class="icon-btn" title="Carrito">🛒</button>
                    <span class="cart-badge-header" id="cartBadgeHeader">0</span>
                </div>
                <!-- Botón Menú Hamburguesa para desplegar filtros -->
                <button id="menuToggleBtn" class="icon-btn hamburger" title="Filtros">☰</button>
            </div>
        </div>
        
        <!-- Menú Desplegable (Filtros debajo del nombre) -->
        <div id="collapsibleMenu" class="collapsible-menu">
            <div class="container controls">
                <input type="text" id="searchInput" placeholder="Buscar productos...">
                
                <select id="categoryFilter">
                    <option value="all">Todas las categorías</option>
                    <option value="perifericos">Periféricos</option>
                    <option value="iluminacion">Iluminación RGB</option>
                    <option value="organizacion">Organización</option>
                    <option value="decoracion">Decoración</option>
                </select>

                <select id="sortFilter">
                    <option value="default">Ordenar por...</option>
                    <option value="price-asc">Menor precio</option>
                    <option value="price-desc">Mayor precio</option>
                    <option value="name-asc">Nombre (A-Z)</option>
                </select>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Saludo de usuario logueado -->
        <div id="userGreeting" style="display:none; margin-top:1.5rem; padding:1rem; background:var(--bg-card); border-left:3px solid var(--neon-secondary); border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
            <p>Hola, <b id="greetingName" style="color:var(--neon-primary)"></b>. ¡Bienvenido a tu tienda!</p>
            <div>
                <a href="admin.html" id="adminLink" class="btn-secondary" style="display:none; margin-right:1rem; text-decoration:none; padding: 0.4rem 0.8rem; font-size: 0.8rem;">Panel Admin</a>
                <button id="logoutLink" class="btn-secondary" style="border-color:#ff3366; color:#ff3366; padding: 0.4rem 0.8rem; font-size: 0.8rem;">Cerrar Sesión</button>
            </div>
        </div>

        <div id="productGrid" class="product-grid">
            <!-- Productos -->
        </div>
    </main>

    <!-- Modal Detalles de Producto -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeProductModal">&times;</span>
            <div class="modal-body product-details">
                <img id="modalImg" src="" alt="Producto">
                <div class="modal-info">
                    <h2 id="modalTitle"></h2>
                    <span id="modalCategory" class="badge"></span>
                    <p id="modalDescription"></p>
                    <div class="price-stock">
                        <span id="modalPrice" class="price"></span>
                        <span id="modalStock" class="stock"></span>
                    </div>
                    <button id="addToCartBtn" class="btn-primary">Agregar al Carrito 🛒</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Login / Registro -->
    <div id="authModal" class="modal">
        <div class="modal-content" style="max-width:400px;">
            <span class="close-modal" id="closeAuthModal" style="z-index:100;">&times;</span>
            <div class="modal-body" style="flex-direction:column; gap:1.5rem; padding: 2.5rem 2rem;">
                <h2 id="authTitle" style="text-align:center; font-size: 1.5rem;">Iniciar Sesión</h2>
                <form id="authForm" style="display: flex; flex-direction: column; gap: 1rem;">
                    <input type="text" id="authUsername" placeholder="Nombre de Usuario" required>
                    <input type="password" id="authPassword" placeholder="Contraseña" required>
                    <button type="submit" class="btn-primary" id="authSubmitBtn">Entrar</button>
                    <p class="error-msg" id="authError" style="display:none; text-align:center;"></p>
                    
                    <p style="text-align:center; font-size: 0.9rem; margin-top:1rem; color:var(--text-muted)">
                        <span id="authToggleText">¿No tienes cuenta?</span> 
                        <a href="#" id="toggleAuthMode" style="color:var(--neon-secondary); text-decoration:none; font-weight:bold;">Regístrate</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Sidebar Carrito -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Tu Pedido</h2>
            <span class="close-modal" id="closeCart" style="position:static; margin-left:auto;">&times;</span>
        </div>
        <div class="cart-body" id="cartBody">
            <!-- Items del carrito -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">$0</span>
            </div>
            <button id="checkoutBtn" class="btn-primary" style="width: 100%">Enviar pedido por WhatsApp 💬</button>
        </div>
    </div>

    <!-- Contenedor para Notificaciones (Toasts) -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="js/data.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
